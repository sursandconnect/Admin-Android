<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f28c28"><title>Super Admin Module</title>
<style>
:root{--bg:#f8fafc;--panel:#fff;--panel2:#fff8ee;--text:#263238;--muted:#667085;--border:#e6ebe7;--s:#f28c28;--g:#238b45;--red:#b91c1c}
html.dark{--bg:#111827;--panel:#1f2937;--panel2:#273449;--text:#f8fafc;--muted:#cbd5e1;--border:#374151}
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,a{font-family:inherit}.head{height:72px;margin:8px 10px 0;border-radius:18px;background:linear-gradient(135deg,#ff9d42,#f28c28,#e8740e);display:flex;align-items:center;gap:10px;padding:9px 11px;box-shadow:0 11px 26px rgba(219,112,17,.22);position:relative;z-index:50}
.logo{width:48px;height:48px;border-radius:13px;background:#fff;object-fit:contain;padding:2px;box-shadow:0 5px 13px rgba(122,68,16,.17)}
.headcopy{min-width:0;flex:1}.headcopy h1{margin:0;color:#fff;font-size:18px}.headcopy p{margin:3px 0 0;color:rgba(255,255,255,.92);font-size:8.5px}
.headbtns{display:flex;gap:6px}.iconbtn{width:38px;height:38px;border:0;border-radius:11px;background:#fff;color:#bd5d08;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 13px rgba(122,68,16,.15)}
.dot{display:none;position:absolute;right:5px;top:4px;width:8px;height:8px;border-radius:50%;background:#dc2626;border:1px solid #fff}
.menu{display:none;position:absolute;right:10px;top:66px;width:215px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:7px;box-shadow:0 16px 38px rgba(15,23,42,.2);z-index:100}.menu.active{display:block}.menu button,.menu a{width:100%;border:0;background:transparent;color:var(--text);padding:9px 8px;border-radius:9px;text-align:left;font-size:9px;font-weight:800;display:flex;gap:8px;align-items:center;text-decoration:none}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:9000;min-width:220px;max-width:88vw;padding:10px 13px;border-radius:12px;background:#176b35;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.22);font-size:9px;font-weight:900;text-align:center;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:3000;align-items:center;justify-content:center;padding:13px}.modal.active{display:flex}.confirm{z-index:5000!important}.dialog{width:min(96vw,700px);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:18px;padding:14px;box-shadow:0 28px 80px rgba(0,0,0,.34)}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dialoghead h3{margin:0;font-size:15px}.close{width:32px;height:32px;border:0;border-radius:9px;background:var(--panel2);color:var(--text);font-size:18px}
.small{border:0;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.green{background:#eaf7ed;color:#176b35}.red{background:#fff1f1;color:#b91c1c}.orange{background:#fff0dd;color:#b45309}.blue{background:#eef4ff;color:#1d4ed8}
@media(max-width:520px){.headcopy h1{font-size:15px}.headcopy p{font-size:7.5px}.logo{width:43px;height:43px}}

body{padding-bottom:20px}.wrap{max-width:1200px;margin:8px auto;padding:0 10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0;flex-wrap:wrap}.toolbar h2{margin:0;font-size:15px}.tools{display:flex;gap:6px;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.07)}.tablewrap{overflow:auto;max-height:calc(100vh - 155px)}table{width:100%;border-collapse:collapse;font-size:9.5px}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:var(--panel2);z-index:2;font-size:9px}.rowacts{display:flex;gap:4px}.rowacts button{border:0;border-radius:7px;padding:6px 8px;font-size:8px;font-weight:900}.empty{padding:28px;text-align:center;font-size:10px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--panel);color:var(--text);font:inherit;font-size:10px}.field textarea{min-height:75px;resize:vertical}.save{grid-column:1/-1;border:0;border-radius:10px;padding:11px;background:#238b45;color:#fff;font-size:9px;font-weight:900}.stopbox{border:1px solid var(--border);border-radius:11px;padding:9px;background:var(--panel2)}.stoprow{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:6px;margin-top:6px}.stoprow input{min-width:0}.stoprow button{border:0;border-radius:8px;background:#fff1f1;color:#b91c1c;font-weight:900}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.detail{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px}.detail small{display:block;color:var(--muted);font-size:8px}.detail b{display:block;font-size:10px;margin-top:3px;word-break:break-word;white-space:normal}@media(max-width:650px){.formgrid,.detailgrid{grid-template-columns:1fr}.field.full,.save{grid-column:1}.stoprow{grid-template-columns:1fr 1fr}}
</style><style id="scCardManagerCss">
@keyframes scAdminSpin{to{transform:rotate(360deg)}}
.scAdminRefresh{width:42px!important;height:42px!important;min-width:42px!important;padding:0!important}
.scAdminRefresh svg{width:23px;height:23px}.scAdminRefresh.refreshing svg{animation:scAdminSpin .72s linear infinite}
.recordgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:11px}
.recordcard{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:12px;min-height:92px;cursor:pointer;box-shadow:0 5px 14px rgba(15,23,42,.055);display:flex;flex-direction:column;justify-content:space-between}
.recordcard:active{transform:scale(.985)}.recordcard .rcicon{font-size:20px}.recordcard h3{font-size:11px;margin:7px 0 3px;line-height:1.25}.recordcard .rcid{font-size:8px;color:var(--muted);font-weight:800}.recordcard .rcsub{font-size:8px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recordcard.pending{border-color:#f59e0b;background:#fffaf0}
.detailHero{display:flex;gap:12px;align-items:center;padding:11px;background:var(--panel2);border-radius:14px;margin-top:10px}.detailHero img,.detailHero .ph{width:72px;height:72px;border-radius:15px;border:1px solid var(--border)}.detailHero img{object-fit:cover}.detailHero .ph{display:grid;place-items:center;background:#fff;font-size:30px}.detailHero h2{font-size:16px;margin:0 0 4px}.detailHero p{font-size:9px;color:var(--muted);margin:0}.detailActions{display:flex;gap:7px;flex-wrap:wrap;position:sticky;bottom:-14px;background:var(--panel);padding:12px 0 2px;margin-top:11px;border-top:1px solid var(--border)}.detailActions button{flex:1;min-width:92px;padding:10px!important}
@media(max-width:700px){.recordgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px}.recordcard{min-height:88px;padding:10px}}
</style><style id="scV47Media">
.recordcard{background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:0 8px 22px rgba(15,23,42,.09)}
.recordcard img{width:48px!important;height:48px!important;border-radius:12px!important;object-fit:cover!important;box-shadow:0 4px 12px rgba(15,23,42,.16)}
.detailHero{background:linear-gradient(135deg,#fff8ef,#effaf5)!important;border:1px solid var(--border)}
.detailHero img{width:92px!important;height:92px!important;object-fit:cover!important;box-shadow:0 7px 20px rgba(15,23,42,.16)}
</style></head><body>
<header class="head"><img class="logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgM6ePTCVaqvhVtE9SqPzEyzrYrHjo0MlxUbzHS1D8ORCNX_at01YJcY6a7ltTxA2AaYEuojBw-VotVudZXLNUHVSs6xQvLX6zbNBh-bVnm0v6gURU0yStk_fObHB9rGNwbkf2v_GTyAmcwAG0m8srp0at1riLJSCvOLU3kFneNoNlX-C1XLbioi4RtmDfU/s1600/IMG_20260820_101456.png"><div class="headcopy"><h1 id="title">Module</h1><p>Sursand Connect owner admin panel</p></div><div class="headbtns"><button class="iconbtn" onclick="location.href='index.html'">⌂</button></div></header>
<main class="wrap"><div class="toolbar"><h2 id="subtitle">Management</h2><div class="tools"><button id="addBtn" class="small green" onclick="openForm(null)">＋ Add</button><button class="small blue" onclick="location.href='index.html'">← Modules</button></div></div><section class="panel"><div id="content" class="empty">Loading...</div></section></main>
<div id="formModal" class="modal"><div class="dialog"><div class="dialoghead"><h3 id="formTitle">Add Record</h3><button class="close" onclick="formModal.classList.remove('active')">×</button></div><form id="form" class="formgrid" onsubmit="return saveForm(event)"></form></div></div>
<div id="detailModal" class="modal"><div class="dialog"><div class="dialoghead"><h3 id="detailTitle">Request Details</h3><button class="close" onclick="detailModal.classList.remove('active')">×</button></div><div id="detailBody"></div></div></div>
<div id="confirmModal" class="modal confirm"><div class="dialog" style="max-width:390px"><div class="dialoghead"><h3 id="confirmTitle">Confirm</h3><button class="close" onclick="resolveConfirm(false)">×</button></div><p id="confirmText" style="font-size:10px;color:var(--muted);line-height:1.5"></p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="small" onclick="resolveConfirm(false)">Cancel</button><button id="confirmYes" class="small green" onclick="resolveConfirm(true)">Confirm</button></div></div></div>
<div id="toast" class="toast"></div>
<script src="module-admin.js"></script><script>
function detectAdminLocation(btn){
  const field=btn.closest(".field"),input=field&&field.querySelector('input[type="hidden"]'),small=field&&field.querySelector("small");
  if(!input||!small)return;
  if(!navigator.geolocation){toastMsg("Location is not supported.",true);return}
  small.textContent="Detecting location...";
  navigator.geolocation.getCurrentPosition(
    p=>{input.value=p.coords.latitude+","+p.coords.longitude;small.textContent=input.value},
    ()=>{small.textContent="Unable to detect location.";toastMsg("Please allow location permission.",true)},
    {enableHighAccuracy:true,timeout:12000}
  );
}
function selectAdminLocation(btn){const field=btn.closest('.field'),input=field.querySelector('input[type=hidden]'),small=field.querySelector('small');SCMapPicker.open(input,small)}
</script>
<style>.adminLoc{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.adminLoc small{width:100%;font-size:8px;color:var(--muted)}</style>
<script src="admin-card-view.js"></script><script src="app-location-picker.js"></script></body></html>
