<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Admins</title><style>
:root{--bg:#f8fafc;--panel:#fff;--panel2:#fff8ee;--text:#263238;--muted:#667085;--border:#e6ebe7;--s:#f28c28;--g:#238b45;--red:#b91c1c}
html.dark{--bg:#111827;--panel:#1f2937;--panel2:#273449;--text:#f8fafc;--muted:#cbd5e1;--border:#374151}
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,a{font-family:inherit}.head{height:72px;margin:8px 10px 0;border-radius:18px;background:linear-gradient(135deg,#ff9d42,#f28c28,#e8740e);display:flex;align-items:center;gap:10px;padding:9px 11px;box-shadow:0 11px 26px rgba(219,112,17,.22);position:relative;z-index:50}
.logo{width:48px;height:48px;border-radius:13px;background:#fff;object-fit:contain;padding:2px;box-shadow:0 5px 13px rgba(122,68,16,.17)}
.headcopy{min-width:0;flex:1}.headcopy h1{margin:0;color:#fff;font-size:18px}.headcopy p{margin:3px 0 0;color:rgba(255,255,255,.92);font-size:8.5px}
.headbtns{display:flex;gap:6px}.iconbtn{width:38px;height:38px;border:0;border-radius:11px;background:#fff;color:#bd5d08;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 5px 13px rgba(122,68,16,.15)}
.dot{display:none;position:absolute;right:5px;top:4px;width:8px;height:8px;border-radius:50%;background:#dc2626;border:1px solid #fff}
.menu{display:none;position:absolute;right:10px;top:66px;width:215px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:7px;box-shadow:0 16px 38px rgba(15,23,42,.2);z-index:100}.menu.active{display:block}.menu button,.menu a{width:100%;border:0;background:transparent;color:var(--text);padding:9px 8px;border-radius:9px;text-align:left;font-size:9px;font-weight:800;display:flex;gap:8px;align-items:center;text-decoration:none}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:9000;min-width:220px;max-width:88vw;padding:10px 13px;border-radius:12px;background:#176b35;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.22);font-size:9px;font-weight:900;text-align:center;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b91c1c}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:3000;align-items:center;justify-content:center;padding:13px}.modal.active{display:flex}.confirm{z-index:5000!important}.dialog{width:min(96vw,700px);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:18px;padding:14px;box-shadow:0 28px 80px rgba(0,0,0,.34)}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dialoghead h3{margin:0;font-size:15px}.close{width:32px;height:32px;border:0;border-radius:9px;background:var(--panel2);color:var(--text);font-size:18px}
.small{border:0;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.green{background:#eaf7ed;color:#176b35}.red{background:#fff1f1;color:#b91c1c}.orange{background:#fff0dd;color:#b45309}.blue{background:#eef4ff;color:#1d4ed8}
@media(max-width:520px){.headcopy h1{font-size:15px}.headcopy p{font-size:7.5px}.logo{width:43px;height:43px}}

.wrap{max-width:900px;margin:8px auto;padding:0 10px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:9px}table{width:100%;border-collapse:collapse;font-size:9px}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left}th{background:var(--panel2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800}.field input,.field textarea{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--panel);color:var(--text)}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:1}}</style></head><body>
<header class="head"><img class="logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgM6ePTCVaqvhVtE9SqPzEyzrYrHjo0MlxUbzHS1D8ORCNX_at01YJcY6a7ltTxA2AaYEuojBw-VotVudZXLNUHVSs6xQvLX6zbNBh-bVnm0v6gURU0yStk_fObHB9rGNwbkf2v_GTyAmcwAG0m8srp0at1riLJSCvOLU3kFneNoNlX-C1XLbioi4RtmDfU/s1600/IMG_20260820_101456.png"><div class="headcopy"><h1>Staff Admins</h1><p>Sursand Connect owner admin panel</p></div><button class="iconbtn" onclick="location.href='index.html'">⌂</button></header>
<main class="wrap"><div style="display:flex;justify-content:flex-end;gap:7px;margin:9px 0"><button class="small green" onclick="openCreate()">＋ Create Admin</button><button class="small blue" onclick="location.href='index.html'">← Modules</button></div><section class="panel"><div id="content">Loading...</div></section></main>
<div id="createModal" class="modal"><div class="dialog"><div class="dialoghead"><h3>Create Staff Admin</h3><button class="close" onclick="createModal.classList.remove('active')">×</button></div><form id="staffForm" class="formgrid" onsubmit="return saveStaff(event)"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Mobile *</label><input name="mobile" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Ward *</label><select name="ward" required style="border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--panel);color:var(--text)"><option value="">Select Ward</option><option>Ward 1</option><option>Ward 2</option><option>Ward 3</option><option>Ward 4</option><option>Ward 5</option><option>Ward 6</option><option>Ward 7</option><option>Ward 8</option><option>Ward 9</option><option>Ward 10</option><option>Ward 11</option><option>Ward 12</option><option>Ward 13</option><option>Ward 14</option><option>Ward 15</option><option>Ward 16</option><option>Ward 17</option><option>Ward 18</option><option>Ward 19</option></select></div><div class="field full"><label>Address</label><textarea name="address"></textarea></div><div class="field"><label>Initial Password *</label><input name="password" type="password" minlength="6" required></div><button class="small green" style="grid-column:1/-1;padding:11px">Create Admin</button></form></div></div>
<div id="confirmModal" class="modal confirm"><div class="dialog" style="max-width:390px"><div class="dialoghead"><h3 id="confirmTitle"></h3><button class="close" onclick="resolveConfirm(false)">×</button></div><p id="confirmText" style="font-size:10px;color:var(--muted)"></p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="small" onclick="resolveConfirm(false)">Cancel</button><button id="confirmYes" class="small green" onclick="resolveConfirm(true)">Confirm</button></div></div></div><div id="toast" class="toast"></div>
<script>window.scMessage=window.scMessage||function(m,e){const t=document.getElementById("toast");if(t){t.textContent=m||"Done";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}};const API="https://script.google.com/macros/s/AKfycbyjTV3BcPjYhXEDFlRhw0P-ZNDR7_k47N3emxak9ccgB2iHjUadognpyWUTBaZe07bu/exec",TOKEN_KEY='scSuperAdminToken';const $=id=>document.getElementById(id);let token=localStorage.getItem(TOKEN_KEY)||'',rows=[],cr=null;function post(p){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(r=>r.text()).then(t=>{let x;try{x=JSON.parse(t)}catch(e){throw Error('Invalid server response.')}if(!x||x.success!==true)throw Error(x&&x.error?x.error:'Request failed.');return x})}function toastMsg(m,e=false){toast.textContent=m;toast.classList.toggle('error',e);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}function ask(t,m,b){confirmTitle.textContent=t;confirmText.textContent=m;confirmYes.textContent=b;confirmModal.classList.add('active');return new Promise(r=>cr=r)}function resolveConfirm(v){confirmModal.classList.remove('active');if(cr){const r=cr;cr=null;r(v)}}async function load(){if(!token){location.replace('index.html');return}try{const r=await post({action:'superAdminListStaff',token});rows=r.data||[];if(!rows.length){content.innerHTML='<div style="padding:20px;text-align:center">No staff admins found.</div>';return}content.innerHTML='<table><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Ward</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows.map((a,i)=>`<tr><td>${a.name||''}</td><td>${a.mobile||''}</td><td>${a.email||''}</td><td>${a.ward||''}</td><td>${a.status||''}</td><td><button class="small ${a.status==='Active'?'red':'green'}" onclick="toggleStaff(${i})">${a.status==='Active'?'Disable':'Enable'}</button></td></tr>`).join('')+'</tbody></table>'}catch(e){content.textContent=e.message}}function openCreate(){staffForm.reset();createModal.classList.add('active')}async function saveStaff(e){e.preventDefault();if(!await ask('Create Staff Admin','Create this staff admin account?','Create'))return false;const d={action:'superAdminCreateStaff',token};new FormData(staffForm).forEach((v,k)=>d[k]=v);try{const r=await post(d);createModal.classList.remove('active');toastMsg(r.data.message||'Admin created successfully.');load()}catch(e){toastMsg(e.message,true)}return false}async function toggleStaff(i){const a=rows[i],st=a.status==='Active'?'Disabled':'Active';if(!await ask(st+' Admin',st+' '+a.name+'?',st))return;try{const r=await post({action:'superAdminSetStaffStatus',token,id:a.id,status:st});toastMsg(r.data.message||'Admin updated.');load()}catch(e){toastMsg(e.message,true)}}document.addEventListener('DOMContentLoaded',()=>{document.documentElement.classList.toggle('dark',(localStorage.getItem('scSuperTheme')||'light')==='dark');load();if(new URLSearchParams(location.search).get('action')==='create')setTimeout(openCreate,300)});</script><script src="admin-header-refresh.js"></script></body></html>
